[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naaccr-lri-validator"
version = "0.1.0"
description = "Offline validator for NAACCR LRI HL7 v2.5.1 ORU_R01 messages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["hl7apy==1.3.5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
lri-validate = "lri_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lri_validator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
